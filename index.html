<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css">
    <title>An Interactive 3D Solar System</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div id="simulation-ui">
      <h3>Solar System Controls</h3>

      <div class="speed-info">
        <span>Simulation Speed</span>
        <span id="speed-value">1 day/sec</span>
      </div>

      <input
        type="range"
        id="speed-slider"
        min="0"
        max="100"
        step="0.1"
        value="1"
      />

      <div class="speed-presets">
        <button data-speed="0">Pause</button>
        <button data-speed="1">1x</button>
        <button data-speed="5">5x</button>
        <button data-speed="10">10x</button>
        <button data-speed="50">50x</button>
        <button data-speed="100">100x</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
